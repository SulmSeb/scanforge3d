# Baut die ScanForge3D_Setup.exe automatisch auf einem Windows-Server von GitHub.
# Ergebnis: Tab "Actions" -> letzter Lauf -> Artifacts -> ScanForge3D_Setup
name: Windows-Installer bauen
on:
  push:
  workflow_dispatch:
jobs:
  build:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Pakete installieren
        run: pip install -r requirements.txt pyinstaller py7zr
      - name: Kern-Tests
        run: python -m tests.test_core
      - name: COLMAP + OpenMVS laden
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: python tools/download_tools.py
      - name: COLMAP-Selbsttest
        shell: pwsh
        run: |
          $c = Get-ChildItem tools\colmap -Recurse -Filter colmap.exe | Select-Object -First 1
          & $c.FullName help | Select-Object -First 5
      - name: PyInstaller
        run: >
          pyinstaller --noconfirm --clean --windowed --name ScanForge3D
          --icon assets\icon.ico --add-data "assets;assets"
          --collect-submodules pyqtgraph --collect-data trimesh main.py
      - name: Werkzeuge beilegen
        shell: pwsh
        run: |
          Copy-Item tools\colmap dist\ScanForge3D\tools\colmap -Recurse
          Copy-Item tools\openmvs dist\ScanForge3D\tools\openmvs -Recurse
          Invoke-WebRequest https://aka.ms/vs/17/release/vc_redist.x64.exe -OutFile vc_redist.x64.exe
      - name: Inno Setup
        shell: pwsh
        run: |
          if (-not (Get-Command iscc -ErrorAction SilentlyContinue)) { choco install innosetup -y --no-progress }
          $iscc = (Get-Command iscc -ErrorAction SilentlyContinue).Source
          if (-not $iscc) { $iscc = "${env:ProgramFiles(x86)}\Inno Setup 6\ISCC.exe" }
          & $iscc installer.iss
      - uses: actions/upload-artifact@v4
        with:
          name: ScanForge3D_Setup
          path: Output\ScanForge3D_Setup.exe
